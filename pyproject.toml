[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clurichaun"
version = "0.2.0"
description = "Universal secret, credential and endpoint scanner for any file type"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
web = ["requests>=2.31.0", "beautifulsoup4>=4.12.0"]
ml = ["tiktoken>=0.7.0"]
cloud = ["boto3>=1.34", "google-cloud-storage>=2.16"]
full = [
    "python-magic>=0.4.27",
    "py7zr>=0.21",
    "rarfile>=4.2",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]
dev = ["pytest>=8.0", "mypy>=1.8", "ruff>=0.5"]

[project.scripts]
clurichaun = "clurichaun.cli:main"

[tool.setuptools.packages.find]
include = ["clurichaun*"]

[tool.setuptools.package-data]
clurichaun = ["rules/*.toml", "rules/*.yml", "rules/*LICENSE*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
