  categories:
  - api
  - secret
  examples:
  - HAWK_API_KEY="hawk.nHAOHdJjXoNyzAcTDC5M.R2gqQh2aCesrh0yCGB7q"
  references:
  - https://docs.stackhawk.com/web-app/
- name: Stripe API Key
