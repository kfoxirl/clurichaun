- name: Twitch Stream Key
  id: np.twitch.1
  pattern: "(?xi)\n(?:\n  \\b (?:twitch)? (?:[_-]?)? stream (?:[_-]?)? key \\b\n \
    \ [^A-Za-z0-9]{0,3}\n)?\n[\"']?\n(\n  live_                                (?#\
    \ live_ prefix)\n  \\d{8,12}                             (?# 8–12 digit account\
    \ ID - examples have 9, unsure of variance)\n  _\n  [A-Za-z0-9]{30,36}       \
    \            (?# underscore followed by 30-36 chars)\n)\n[\"']?\n"
  categories:
  - api
  - secret
  references:
  - https://help.twitch.tv/s/article/twitch-stream-key-faq?language=en_US
  examples:
  - STREAM_KEY=live_126031192_RJVJxpxq8Q1X1Qdc9SwwTvpXonANmi
  - live_126031192_tiX3sbwIzL9VmkecdxioBMA1LJ9S4m
  - live_126031192_IgvUabrXbWSihj2ENnA59G1F8349jn
  - live_126031192_m3owJxYRKOf531B9Zc3ZQcLfOLCzKK
  negative_examples:
  - TWITCH_STREAM_KEY = "126031192_IgvUabrXbWSihj2ENnA59G1F8"
  - live_126031192_IgvUabrXbWSihj2ENnA59G1F8
  - 'stream_url: "rtmp://live.twitch.tv/app/STREAM_KEY"'
- name: Twitter Client ID
  id: np.twitter.1
  pattern: '(?x)(?i)

    \b twitter

    .?

    (?: api | app | application | client | consumer | customer )?

    .?

    (?: id | identifier | key )

    .{0,2} \s{0,20} .{0,2} \s{0,20} .{0,2}  (?# string terminators, whitespace, binding
    operators, etc )

    \b ([a-z0-9]{18,25}) \b

    '
  references:
  - https://developer.twitter.com/en/docs/authentication/overview
  examples:
  - '     TWITTER_ID:               "DkWLqcP3ace3wHuJ7fiw",'
  - '# TWITTER_API_KEY = ''UZYoBAfBzNace3mBwPOGYw''

    # TWITTER_API_SECRET = ''ngHaeaRPKA5BDQNXace3LWA1PvTA1kBGDaAJmc517E''

    '
  categories:
  - api
  - fuzzy
  - identifier
- name: Twitter Secret Key
  id: np.twitter.2
  pattern: '(?x)(?i)

    twitter

    .?

    (?: api | app | application | client | consumer | customer | secret | key )

    .?

    (?: key | oauth | sec | secret )?

    .{0,2} \s{0,20} .{0,2} \s{0,20} .{0,2}  (?# string terminators, whitespace, binding
    operators, etc )

    \b ([a-z0-9]{35,44}) \b

    '
  references:
  - https://developer.twitter.com/en/docs/authentication/overview
  categories:
  - api
  - fuzzy
  - secret
  examples:
  - '# TWITTER_API_KEY = ''UZYoBAfBzNace3mBwPOGYw''

    # TWITTER_API_SECRET = ''ngHaeaRPKA5BDQNXace3LWA1PvTA1kBGDaAJmc517E''

    '
  negative_examples:
  - "Twitter(auth=OAuth('MjuHWoGbzYmJv3ZuHaBvSENfyevu00NQuBc40VM',\n             \
    \      'anJLBCOALCXl7aXeybmNA5oae9E03Cm23cKNMLaScuXwk',\n                   'kl3E14NQx84qxO1dy247V0b2W',\n\
    \                   '5VFVXVMq9bDJzFAKPfWOiYmJZin2F7YLhSfoyLBXf6Bc9ngX3g'))\n"
- name: Credentials in Connect-VIServer Invocation
  id: np.vmware.1
  pattern: '(?x)(?i)

    Connect-VIServer

    .{0,50}

    -User \s+ (\S{3,30}) \s+        (?# username )

    .{0,50}

    -Password \s+ (\S{3,30})        (?# password )

    '
  categories:
  - fuzzy
  - secret
  description: 'Credentials were found in a `Connect-VIServer` invocation. `Connect-VIServer`
    is a command to connect to a VMWare vCenter Server. An attacker may be able to
    use these credentials to authenticate to vSphere instances, and depending on the
    associated privileges, administrate the resources such as Virtual Machines.

    '
  examples:
  - Connect-VIServer -Server 192.168.1.51 -User administrator@vSphere.local -Password
    VMware1!
  - '#Set-PowerCLIConfiguration -InvalidCertificateAction:Ignore

    Connect-VIServer "$endpoint" -User "$username" -Password "$password" | Out-Null

    '
  - Connect-VIServer $ESXiHost.EsxiHost -user $ESXiUser -password $ESXipass
  - $null = connect-viserver vc.lab.local -user administrator@vsphere.local -password
    VMware1!
  references:
  - https://developer.broadcom.com/powercli/latest/vmware.vimautomation.core/commands/connect-viserver
- name: WireGuard Private Key
  id: np.wireguard.1
  pattern: PrivateKey\s*=\s*([A-Za-z0-9+/]{43}=)
  examples:
  - '[Interface]

    Address = 10.200.200.3/32

    PrivateKey = AsaFot43bfs1fEWjvtty+rGcjh3rP1H6sug1l3u19ix=

    DNS = 8.8.8.8

    '
  references:
  - https://www.wireguard.com/quickstart/
  - https://manpages.debian.org/testing/wireguard-tools/wg.8.en.html
  - https://gist.github.com/lanceliao/5d2977f417f34dda0e3d63ac7e217fd6
  categories:
  - fuzzy
  - secret
- name: WireGuard Preshared Key
  id: np.wireguard.2
  pattern: PresharedKey\s*=\s*([A-Za-z0-9+/]{43}=)
  examples:
  - '[Peer]

    PublicKey = [Server''s public key]

    PresharedKey = uRsfsZ2Ts1rach4Zv3hhwcx6wa5fuIo2u3w7sa+7j81=

    AllowedIPs = 0.0.0.0/0, ::/0

    Endpoint = [Server Addr:Server Port]

    '
  references:
  - https://www.wireguard.com/quickstart/
  - https://manpages.debian.org/testing/wireguard-tools/wg.8.en.html
  - https://gist.github.com/lanceliao/5d2977f417f34dda0e3d63ac7e217fd6
  categories:
  - fuzzy
