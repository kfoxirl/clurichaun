  - https://stripe.com/docs/keys
  examples:
  - //var stripe = require("stripe")("sk_test_nxOdTTuEace5Ajbh3svpG32m");
- name: Tavily API Key
  id: np.tavily.1
  description: 'A Tavily API Key was found. Tavily provides web search capabilities
    for AI and LLM applications. An attacker could use this API key to consume limited,
    possibly paid resources, or cause denial-of-service.

    '
  pattern: "(?x)\n\\b\n(\n  tvly-[a-zA-Z0-9]{32}\n)\n\\b\n"
  categories:
  - api
  - secret
  references:
  - https://docs.tavily.com/api-reference
  examples:
  - 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
  - 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
  - TAVILY_API_KEY = "tvly-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
- name: TeamCity API Token
  id: np.teamcity.1
  pattern: '(?x)

    \b (

    eyJ0eXAiOiAiVENWMiJ9             (?# decodes to `{"typ": "TCV2"}` )

    \.

    [A-Za-z0-9_-]{36}

    \.

    [A-Za-z0-9_-]{48}

    ) (?: [^A-Za-z0-9_-] | $ )

    '
  examples:
  - <add key="ClearTextPassword" value="eyJ0eXAiOiAiVENWMiJ9.RkNWLXdXS3M1RVBfencxM4A0WmJzdVlCQzFj.OGY1OWRkNGMtYTUxYS04ZDYwLWFiZGYtZWE5MWFhZWJiODhh"
    />
  references:
  - https://www.jetbrains.com/help/teamcity/rest/teamcity-rest-api-documentation.html
  description: 'A TeamCity REST API token was found. TeamCity is a CI/CD platform
    from JetBrains. An attacker may be able to use this token to access source code,
    secrets, and build resources, enabling a supply chain attack.

    '
- name: Telegram Bot Token
  id: np.telegram.1
  pattern: '(?x)

    \b

    (\d+:AA[a-zA-Z0-9_-]{32,33})

    (?: [^a-zA-Z0-9_-] | $)

    '
  categories:
  - api
  - secret
  examples:
  - 4839574813:AAFD39kkdpWt3ywyRZergyOLMaJhac61qc
  - 4839574813:AAE4A6Rz0CSnIGzeu897OjQnjzsMEG2_uso
  references:
  - https://core.telegram.org/bots/api
  - https://core.telegram.org/bots/features#botfather
- name: ThingsBoard Access Token
  id: np.thingsboard.1
  pattern: '(?x)

    thingsboard\.cloud/api/v1/

    ([a-z0-9]{20})

    '
  categories:
  - api
  - identifier
  - secret
  examples:
  - http://thingsboard.cloud/api/v1/354u1g321kcqc1oad3w7/telemetry
  - https://thingsboard.cloud/api/v1/354u1g321kcqc1oad3w7/telemetry
  - coap://coap.thingsboard.cloud/api/v1/354u1g321kcqc1oad3w7/telemetry
  references:
  - https://thingsboard.io/docs/paas/reference/http-api/
  - https://thingsboard.io/docs/paas/reference/coap-api/
- name: ThingsBoard Provision Device Key
  id: np.thingsboard.2
  pattern: '(?x)

    "provisionDeviceKey"\s*:\s*"

    ([a-z0-9]{20})

    "

    '
  categories:
  - api
  - secret
  examples:
  - '"{"deviceName": "DEVICE_NAME", "provisionDeviceKey": "s2s1gfcuatgbi61n8h5s",
    "provisionDeviceSecret": "xbzsovaw9ix4qfhi14an"}"'
  references:
  - https://thingsboard.io/docs/paas/reference/http-api/
  - https://thingsboard.io/docs/paas/user-guide/device-provisioning/
- name: ThingsBoard Provision Device Secret
  id: np.thingsboard.3
  pattern: '(?x)

    "provisionDeviceSecret"\s*:\s*"

    ([a-z0-9]{20})

    "

    '
  categories:
  - api
  - fuzzy
  - secret
  examples:
  - '"{"deviceName": "DEVICE_NAME", "provisionDeviceKey": "s2s1gfcuatgbi61n8h5s",
    "provisionDeviceSecret": "xbzsovaw9ix4qfhi14an"}"'
  references:
  - https://thingsboard.io/docs/paas/reference/http-api/
  - https://thingsboard.io/docs/paas/user-guide/device-provisioning/
- name: TrueNAS API Key (WebSocket)
  id: np.truenas.1
  pattern: '(?x)

    "params"\s*:\s*\[\s*"

    (\d+-[a-zA-Z0-9]{64})

    "\s*\]

    '
  categories:
  - api
  - fuzzy
  - secret
  examples:
  - '{"id":"3286a508-a6ca-278a-c078-85b2b515d8d2", "msg":"method", "method":"auth.login_with_api_key",
    "params":["8-Lp22ov7halMBLUpG97Wg4y7fibQi3CW19VJiZcCu746zgCs0mdDdTCoOcpgEucgu"]}'
  - '{"id":"677d9914-f598-f497-e77e-2a3aadbb822e", "msg":"method", "method":"auth.login_with_api_key",
    "params" : ["9-hTSZDBPyg0PjRZvWb8omoxJ7X2gAjRGmiPKql9ENGIUP9OPtEAzz5f6g9YIMVbZT"]}'
  - '{"id":"2755dad4-cc12-94bb-a894-ba0f85c3fdbf", "msg":"method", "method":"auth.login_with_api_key",
    "params" : [ "10-6LZBVhNq8zze0rzXJptfSWDBoskWuThnQb3fUVw4sVNgJ7GKT3ITVIovhwPf34oL"
    ]}'
  - "{\n  \"id\": \"2755dad4-cc12-94bb-a894-ba0f85c3fdbf\",\n  \"msg\": \"method\"\
    ,\n  \"method\": \"auth.login_with_api_key\",\n  \"params\": [\n    \"10-6LZBVhNq8zze0rzXJptfSWDBoskWuThnQb3fUVw4sVNgJ7GKT3ITVIovhwPf34oL\"\
    \n  ]\n}\n"
  references:
  - https://www.truenas.com/docs/api/core_websocket_api.html
  - https://www.truenas.com/docs/api/scale_rest_api.html
  - https://www.truenas.com/docs/scale/scaletutorials/toptoolbar/managingapikeys/
  - https://www.truenas.com/docs/scale/scaleclireference/auth/cliapikey/
  - https://www.truenas.com/docs/scale/api/
  - https://www.truenas.com/community/threads/api-examples-in-perl-python.108053/
- name: TrueNAS API Key (REST API)
  id: np.truenas.2
  pattern: '(?x)

    Bearer\s*

    (\d+-[a-zA-Z0-9]{64})

    \b

    '
  categories:
  - api
  - fuzzy
  - secret
  examples:
  - 'curl -X POST "http://192.168.0.30/api/v2.0/device/get_info" -H "Content-Type:
    application/json" -H "Authorization: Bearer 8-Lp22ov7halMBLUpG97Wg4y7fibQi3CW19VJiZcCu746zgCs0mdDdTCoOcpgEucgu"
    -d "\"SERIAL\""'
  references:
  - https://www.truenas.com/docs/api/core_websocket_api.html
  - https://www.truenas.com/docs/api/scale_rest_api.html
  - https://www.truenas.com/docs/scale/scaletutorials/toptoolbar/managingapikeys/
  - https://www.truenas.com/docs/scale/scaleclireference/auth/cliapikey/
  - https://www.truenas.com/docs/scale/api/
  - https://www.truenas.com/community/threads/api-examples-in-perl-python.108053/
- name: Twilio API Key
  id: np.twilio.1
