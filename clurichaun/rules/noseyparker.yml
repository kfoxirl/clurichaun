rules:
- name: Adafruit IO Key
  id: np.adafruit.1
  pattern: '(?x)

    \b

    (aio\_[a-zA-Z0-9]{28})

    \b

    '
  examples:
  - '#define IO_KEY       "aio_NrZCb67VvzSaM7fr3nMXrfZ1uMPH"'
  - export IO_KEY="aio_NrZCb67VvzSaM7fr3nMXrfZ1uMPH"
  - ADAFRUIT_IO_KEY = "aio_NrZCb67VvzSaM7fr3nMXrfZ1uMPH"
  references:
  - https://io.adafruit.com/api/docs
  categories:
  - api
  - secret
- name: Adobe OAuth Client Secret
  id: np.adobe.1
  pattern: '(?x)(?i)

    \b

    (p8e-[a-z0-9-]{32})

    (?:[^a-z0-9-]|$)

    '
  references:
  - https://developer.adobe.com/developer-console/docs/guides/authentication/
  - https://developer.adobe.com/developer-console/docs/guides/authentication/OAuthIntegration/
  - https://developer.adobe.com/developer-console/docs/guides/authentication/OAuth/
  examples:
  - "{\n \"client_credentials\": {\n  \"client_id\": \"a65b0146769d433a835f36660881db50\"\
    ,\n  \"client_secret\": \"p8e-ibndcvsmAp9ZgPBZ606FSlYIZVlsZ-g5\"\n},\n"
  categories:
  - api
  - secret
- name: Age Recipient (X25519 public key)
  id: np.age.1
  pattern: \b(age1[0-9a-z]{58})\b
  examples:
  - age1zvkyg2lqzraa2lnjvqej32nkuu0ues2s82hzrye869xeexvn73equnujwj
  references:
  - https://age-encryption.org
  - https://htmlpreview.github.io/?https://github.com/FiloSottile/age/blob/main/doc/age.1.html
  - https://github.com/C2SP/C2SP/blob/8b6a842e0360d35111c46be2a8019b2276295914/age.md#the-x25519-recipient-type
  categories:
  - identifier
- name: Age Identity (X22519 secret key)
  id: np.age.2
  pattern: \b(AGE-SECRET-KEY-1[0-9A-Z]{58})\b
  examples:
  - '# created: 2022-09-26T21:55:47-05:00

    # public key: age1epzmwwzw8n09slh0c7z1z52x43nnga7lkksx3qrh07tqz5v7lcys45428t

    AGE-SECRET-KEY-1HJCRJVK7EE3A5N8CRP8YSEUGZKNW90Y5UR2RGYAS8L279LFP6LCQU5ADNR

    '
  - AGE-SECRET-KEY-1GFPYYSJZGFPYYSJZGFPYYSJZGFPYYSJZGFPYYSJZGFPYYSJZGFPQ4EGAEX
  references:
  - https://age-encryption.org
  - https://htmlpreview.github.io/?https://github.com/FiloSottile/age/blob/main/doc/age.1.html
  - https://github.com/C2SP/C2SP/blob/8b6a842e0360d35111c46be2a8019b2276295914/age.md#the-x25519-recipient-type
  categories:
  - secret
- name: Anthropic API Key
  id: np.anthropic.1
  pattern: '(?x)

    \b

    (sk-ant-api[0-9]{2}-[a-zA-Z0-9_-]{95})

    (?: [^a-zA-Z0-9_-] | $ )

    '
  categories:
  - api
  - secret
  description: 'An Anthropic API key was found. Anthropic is an AI company. An attacker
    could use this API key to consume limited resources, cause denial-of-service,
    or access internal fine-tuned models.

    '
  examples:
  - sk-ant-api03-jSq6OMjv1syXaEUE0bvOckLe_GtCKy8lvZdko3eOJgV8TH-f2iyzRekyZNSby5d9ScikGYuqQhsrxML3X3N3rQ-XwQaQAAA
  - sk-ant-api03-f-SD8UXTHZuL3dhlRLMzMh7sxOopjFG510MC0B6g5Whzu2gM6gYJrQUduYWWQkG8XvkjeVj-MfYvtzMBF7NXSg-W34tmAAA
  references:
  - https://docs.anthropic.com/en/api/getting-started
  - https://support.anthropic.com/en/articles/9767949-api-key-best-practices-keeping-your-keys-safe-and-secure
- name: Artifactory API Key
  id: np.artifactory.1
  pattern: (?i)artifactory.{0,50}\b([a-z0-9]{73})\b
  examples:
  - 'export HOMEBREW_ARTIFACTORY_API_TOKEN=AKCp8igrDNFerC357m4422e4tmu7xB983QLPxJhKFcSMfoux2RFvp8rc4jC8t9ncdmYCMFD8W

    export HOMEBREW_ARTIFACTORY_API_USER=kashorn

    '
  - jfrog rt dl --url=http://localhost:8071/artifactory --apikey=AKCp2WXX7SDvcsmny528sSDnaB3zACkNQoRcD8D1WmxhMV9gk6Wp8mVWC8bh38kJQbXagUT8Z
    generic-local/hello.txt
  references:
  - https://jfrog.com/help/r/jfrog-rest-apis/introduction-to-the-artifactory-rest-apis
  categories:
  - api
  - fuzzy
  - secret
- name: Atlassian Cloud API Token
  id: np.atlassian.1
  pattern: '(?x)

    \b(

    ATATT3xFfGF0 [a-zA-Z0-9_-]{20,200} =[0-9A-F]{8}

    )\b

    '
  categories:
  - api
  - secret
  description: 'An Atlassian Cloud API Token was found. An attacker could use this
    to access resources including Confluence wiki and Jira project management resources.

    '
  references:
  - https://developer.atlassian.com/cloud/jira/software/basic-auth-for-rest-apis/
  examples:
  - '# Replace ''your_email'' and ''your_api_token'' with your actual email and Jira
    API token

    email = ''info@example.com''

    api_token = ''ATATT3xFfGF0pogUFVOH0_AjBEA8LJcnOJx_Ki4yl_PYkv-LwEBQQp3r37KZYnKm8IGQ-KKXDxCl7qnzxF7BRF0a3pwEeAuKEo3iLK7bHXNQgZgVBAURy4RnTnYXwyifmYqWlCAW5J7u04BqXA6pSSceOPQewIpy2CQzDe8MRqmqZw-zcpzSRS0=110E6FC6''

    '
  - '# ######## Set your Jira credentials and endpoint ########

    JIRA_USER="example@example.com"

    JIRA_API_TOKEN="ATATT3xFfGF0xYT7HPCi5lokFfZWNkl0R1xi9BpiieoCRoG3Dn64p6PHPNO-J0-xpcxCZ2GgfV37TfLYSqwT0fQddokHukUVKaxaTqEvQiDM6zbsr2u4ME8Nlp8cTwIvw92CRaD6_U1Awmr3pQFAgIsli5clBlZoRsollYlRztAtrIQ-qDiyUg4=D46B4967"

    '
  - "'jira' => [\n    'host' => env('JIRA_HOST', 'https://example.net'),\n    'user'\
    \ => env('JIRA_USER', 'admin@example.com'),\n    'secret' => env('JIRA_SECRET'),\n\
    \    'token' => env('JIRA_API_TOKEN', 'ATATT3xFfGF0Hv2D5CyGjDnjGL5j9medBUqpDdy923KtUnA3BBICVROxYboITpzmWeDhIeFvj-noomSdyaPSaigvQ4QZg8EN_mfJqQ-gAI4swknj2HDYa2pNROqqvuzWn4HkpIPjQ0Z8MAMOPv5U0QtygZbxhUG73VMwzmlHEAM4Wiv_lS2pCKo=569C722C'),\n\
    ],\n"
- name: Auth0 Application Credentials
  id: np.auth0.1
  pattern: '(?x)(?s)

    (?: AUTH0_DOMAIN | AUTH0_ISSUER_BASE_URL ) \s* = \s* [''"] ( (?:https?://)? [a-zA-Z0-9._-]{10,100})
    [''"]

    .{0,100}

    AUTH0_CLIENT_ID \s* = \s* [''"] ([a-zA-Z0-9]{32}) [''"]

    .{0,100}

    AUTH0_CLIENT_SECRET \s* = \s* [''"] ([a-zA-Z0-9_-]{32,80}) [''"]

    '
  categories:
  - api
  - secret
  - fuzzy
  references:
  - https://auth0.com/docs
  - https://auth0.com/docs/api/authentication
  - https://auth0.com/docs/secure/application-credentials
  description: 'Auth0 OAuth credentials were found. Auth0 is an identity platform
    that provides authorization and authentication capabilities for applications.
    An attacker may be able to use these credentials to impersonate an application
    or access protected resources.

    '
  examples:
  - '```

    REACT_APP_AUTH0_DOMAIN=''dev-boomhauer88dw6tag.us.auth0.com''

    REACT_APP_AUTH0_CLIENT_ID=''HaDNmcczGrrwZ7SkPFTh6Owu3VDcjltm''

    REACT_APP_AUTH0_CLIENT_SECRET=''HgikpUzur6WkE4ol7r2yk_O7wbqd6UWGnFSBE4ByVnGw1cC5_jy_mjWoerv8UXqp''

    REACT_APP_BACKEND_LINK=''http://localhost:3001/signup''

    ```

    '
  - 'AUTH0_SECRET=''2816e32737432c3dec1f5de788696b4efc06e8f833910c8bdef1075b632e4f30''

    AUTH0_BASE_URL=''http://localhost:3000''

    AUTH0_ISSUER_BASE_URL=''https://dev-3a44tw2sa77x73tx.us.auth0.com''

    AUTH0_CLIENT_ID=''oCloQt7XYc1HFas3gSBtYAcekWY25MlF''

    AUTH0_CLIENT_SECRET=''LTYtNGq_4Y48dX5-w7Q96_eBGMcBL1Ic-H62xFcQKn1lg9rmRZQAFw-FHzEQhJuz''

    '
  - 'AUTH0_DOMAIN="dev-r0alk1x87r7luw3z.us.auth0.com"

    AUTH0_CLIENT_ID="ptk5mAig7ibFKW1vhJPNTfEkN5lHQPw8"

    AUTH0_CLIENT_SECRET="yJ-xZ1qycWHUzTUBKr20pUt6zWFmcHSBHus9769LsdOPp2ob8iESrG6MKAMGRkfX"

    '
  - 'export AUTH0_DOMAIN=''example1.us.auth0.com''

    export ALGORITHMS=''RS256''  # Without brackets

    export API_AUDIENCE=''https://example.com''

    export AUTH0_CLIENT_ID=''bR75Zy5DPJHhhh7mHw4k0PRRohl5Rytk''

    export AUTH0_CLIENT_SECRET=''_r7NxNEt5Vd8rjUB_4efca_TtxlRiG_jbWTnRYKMoI86ujEgxSpaP3BcxMx3IJDR''

    '
  negative_examples:
  - '# config variables

    export AUTH0_CALLBACK_URL="http://auth0-rails.dev/callback"

    export AUTH0_CLIENT_ID="nUBJjeJElAPmpwBjhWgWX6aJYovpK0n5"

    export AUTH0_CLIENT_SECRET="wsxY2eUG78qKGTyUpAOUbwCDCwc8mZSQzTmNS-k0qf56uX5nAjQyjRe_iD7oq8b7"

    export AUTH0_DOMAIN="appman18922506.auth0.com"

    '
- name: AWS API Key
  id: np.aws.1
  pattern: \b((?:A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16})\b
  references:
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_identifiers.html
  - https://docs.aws.amazon.com/accounts/latest/reference/credentials-access-keys-best-practices.html
  categories:
  - api
  - identifier
  examples:
  - A3T0ABCDEFGHIJKLMNOP
  - AKIADEADBEEFDEADBEEF
  negative_examples:
  - A3T0ABCDEFGHIJKLMNO
  - A3T0ABCDEFGHIjklmnop
  - ======================
  - //////////////////////
  - ++++++++++++++++++++++
- name: AWS Secret Access Key
  id: np.aws.2
  pattern: '(?x)(?i)

    \b

    aws_? (?:secret)? _? (?:access)? _? (?:key)?

    ["'''']?

    \s{0,30}

    (?::|=>|=)

    \s{0,30}

    ["'''']?

    ([a-z0-9/+=]{40})

    (?: [^a-z0-9/+=] | $ )

    '
  references:
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_identifiers.html
  - https://docs.aws.amazon.com/accounts/latest/reference/credentials-access-keys-best-practices.html
  categories:
  - api
  - fuzzy
  - secret
  examples:
  - aws_secret_access_key:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  - aws_secret_access_key => aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  - aws_access_key_id = FakeValues99ESPW3ALMEZ6U\n  aws_secret_access_key = FakeValues99cl9bqJFVA3iFUm+yqVe08HxhXFE/
  negative_examples:
  - export AWS_SECRET_ACCESS_KEY=ded7db27a4558e2ea9bbf0bf36ae0e8521618f366c
  - '"aws_secret_access_key" =  aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaend'
  - '"aws_secret_access_key" =  aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaendbbbbbbb'
  - '"aws_sEcReT_key"  =  aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaend'
  - 'aws_secret_key: OOzkR1+hF+1ABCsIFDJMEUtqmtnZ1234567890'
  - ======================
  - //////////////////////
  - ++++++++++++++++++++++
- name: AWS Account ID
  id: np.aws.3
  pattern: (?i)aws_?(?:account)_?(?:id)?["'`]?\s{0,30}(?::|=>|=)\s{0,30}["'`]?([0-9]{4}-?[0-9]{4}-?[0-9]{4})
  categories:
  - api
  - fuzzy
  - identifier
  examples:
  - "KeyMetadata: {\n    AWSAccountId: \"324320755747\",\n    Arn: \"arn:aws:kms:us-east-2:324320755747:key/54348bc1-6e3b-4cda-8b18-c6033ca7d328\"\
    ,\n    CreationDate: 2019-07-12 18:23:13 +0000 UTC,\n    Description: \"\",\n\
    \    Enabled: true,\n    KeyId: \"54348bc1-6e3b-4cda-8b18-c6033ca7d328\",\n  \
    \  KeyManager: \"CUSTOMER\",\n    KeyState: \"Enabled\",\n    KeyUsage: \"ENCRYPT_DECRYPT\"\
    ,\n    Origin: \"AWS_KMS\"\n}\n"
  - "4. login into ecr\n\n```bash\naws_region=eu-central-1\naws_account_id=891511536143\n\
    aws_profile=serverless-bert\n\naws ecr get-login-password \\\n    --region $aws_region\
    \ \\\n    --profile $aws_profile \\\n| docker login \\\n    --username AWS \\\n\
    \    --password-stdin $aws_account_id.dkr.ecr.$aws_region.amazonaws.com\n```\n"
  negative_examples:
  - ======================
  - //////////////////////
  - ++++++++++++++++++++++
- name: AWS Session Token
  id: np.aws.4
  pattern: (?i)(?:aws.?session|aws.?session.?token|aws.?token)["'`]?\s{0,30}(?::|=>|=)\s{0,30}["'`]?([a-z0-9/+=]{16,200})[^a-z0-9/+=]
  categories:
  - api
  - fuzzy
  - secret
  negative_examples:
  - ======================
  - //////////////////////
  - ++++++++++++++++++++++
  examples:
  - 'export AWS_ACCESS_KEY_ID="I08BCX2ACV45ED1DOC9J"

    export AWS_SECRET_ACCESS_KEY="0qk+o7XctJMmG6ydO8537c9+TofLJU1K0PiVBXSg"

    export AWS_SESSION_TOKEN="eyJhbGciOiJIUzUxMi53InR5cCI6IkpXVCJ9..J-a9PORJToz7MUrnPQlOywcqtVMNkXy53Gedp_V4PW-Gbf1_BAMjwuw_X7fKRd6hkNfEn43CKKju7muzi_d1Ig"

    '
- name: Amazon MWS Auth Token
  id: np.aws.5
  pattern: (?i)(amzn\.mws\.[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})
  categories:
  - api
  examples:
  - 'AWS Access Key:AKIAIDQJ6PTGDFFWYX7A

    secret key:IwJz1SHMccAKUKuskdVoHFfkre73BTyF80nRmcWc

    MWS Authorisation Token:  amzn.mws.dab428a1-ed97-fd8d-e045-950d712f6f58

    '
  references:
  - https://docs.developer.amazonservices.com/en_US/dev_guide/index.html
- name: AWS S3 Bucket
  id: np.s3.1
  pattern: "(?x)\n(?: ^ | [\\s/\"'] | %2F )\n(\n(?: [a-zA-Z0-9_-]+ \\. )+   (?# bucket\
    \ name as subdomain )\n(?: s3\n  | s3-af-south-1\n  | s3-ap-east-1\n  | s3-ap-northeast-1\n\
    \  | s3-ap-northeast-2\n  | s3-ap-northeast-3\n  | s3-ap-south-1\n  | s3-ap-south-2\n\
    \  | s3-ap-southeast-1\n  | s3-ap-southeast-2\n  | s3-ap-southeast-3\n  | s3-ap-southeast-4\n\
    \  | s3-ca-central-1\n  | s3-eu-central-1\n  | s3-eu-central-2\n  | s3-eu-north-1\n\
    \  | s3-eu-south-1\n  | s3-eu-south-2\n  | s3-eu-west-1\n  | s3-eu-west-2\n  |\
    \ s3-eu-west-3\n  | s3-me-central-1\n  | s3-me-south-1\n  | s3-sa-east-1\n  |\
    \ s3-us-east-1\n  | s3-us-east-2\n  | s3-us-gov-east-1\n  | s3-us-gov-west-1\n\
    \  | s3-us-west-1\n  | s3-us-west-2\n  )\n\\.amazonaws\\.com\n) \\b\n"
  references:
  - https://docs.aws.amazon.com/general/latest/gr/rande.html
  categories:
  - api
  - identifier
  examples:
  - example-bucket.s3.amazonaws.com
  - http://bucket.s3-us-east-2.amazonaws.com
  - http%2F%2Fsome-bucket.s3.amazonaws.com
  negative_examples:
  - .s3.amazonaws.com
  - s3.amazonaws.com
- name: AWS S3 Bucket
  id: np.s3.2
  pattern: "(?x)\n(?: ^ | [\\s/\"'] | %2F )\n(\n(?: s3\n  | s3-af-south-1\n  | s3-ap-east-1\n\
    \  | s3-ap-northeast-1\n  | s3-ap-northeast-2\n  | s3-ap-northeast-3\n  | s3-ap-south-1\n\
    \  | s3-ap-south-2\n  | s3-ap-southeast-1\n  | s3-ap-southeast-2\n  | s3-ap-southeast-3\n\
    \  | s3-ap-southeast-4\n  | s3-ca-central-1\n  | s3-eu-central-1\n  | s3-eu-central-2\n\
    \  | s3-eu-north-1\n  | s3-eu-south-1\n  | s3-eu-south-2\n  | s3-eu-west-1\n \
    \ | s3-eu-west-2\n  | s3-eu-west-3\n  | s3-me-central-1\n  | s3-me-south-1\n \
    \ | s3-sa-east-1\n  | s3-us-east-1\n  | s3-us-east-2\n  | s3-us-gov-east-1\n \
    \ | s3-us-gov-west-1\n  | s3-us-west-1\n  | s3-us-west-2\n  )\n\\.amazonaws\\\
    .com\n/\n[a-zA-Z0-9_][a-zA-Z0-9_-]* (?: \\. [a-zA-Z0-9_-]+)*   (?# bucket name\
    \ as path )\n)\n(?: [^a-zA-Z0-9_-] | $ )                             (?# this\
    \ instead of a \\b anchor because that doesn't play nicely with `-` )\n"
  references:
  - https://docs.aws.amazon.com/general/latest/gr/rande.html
  categories:
  - api
  - identifier
  examples:
  - s3.amazonaws.com/example-bucket
  - http://s3-us-east-2.amazonaws.com/example-bucket
  negative_examples:
  - .s3.amazonaws.com
  - s3.amazonaws.com
  - s3.amazonaws.com/
  - some-bucket-name.s3.amazonaws.com/171ea24dd241f8a2178b0374-username-Reponame-3-0
  - some-bucket.s3.amazonaws.com/some-object-here
- name: Amazon Resource Name
  id: np.arn.1
  pattern: "(?x)\n\\b\n(\n  arn\n  :\n  (?: aws | aws-cn | aws-us-gov )         (?#\
    \ partition )\n  :\n  [a-zA-Z0-9_-]{2,}                       (?# service )\n\
    \  :\n  (?: af-south-1\n    | ap-east-1\n    | ap-northeast-1\n    | ap-northeast-2\n\
    \    | ap-northeast-3\n    | ap-south-1\n    | ap-south-2\n    | ap-southeast-1\n\
    \    | ap-southeast-2\n    | ap-southeast-3\n    | ap-southeast-4\n    | ca-central-1\n\
    \    | eu-central-1\n    | eu-central-2\n    | eu-north-1\n    | eu-south-1\n\
    \    | eu-south-2\n    | eu-west-1\n    | eu-west-2\n    | eu-west-3\n    | me-central-1\n\
    \    | me-south-1\n    | sa-east-1\n    | us-east-1\n    | us-east-2\n    | us-gov-east-1\n\
    \    | us-gov-west-1\n    | us-west-1\n    | us-west-2\n    )?               \
    \                     (?# region )\n  :\n  (?: \\d{12} )?                    \
    \       (?# account ID sans hyphens )\n  :\n  (?: [a-zA-Z0-9_-]+ [:/])?      \
    \         (?# resource type)\n  [^\\s\"'&<>\\\\%]+                          (?#\
    \ resource ID)\n)\n(?: [\\s\"'&<>\\\\%] | $ )\n"
  references:
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/reference-arns.html
  categories:
  - api
  - identifier
  examples:
  - arn:aws:s3:::my_corporate_bucket/*
  - arn:aws:s3:::my_corporate_bucket/Development/*
  - arn:aws:iam::123456789012:user/Development/product_1234/*
  - 'alerts: "arn:aws:sns:us-west-2:123456789023:CloudwatchMetricAlarm"'
  - '"Principal":{"Federated":["arn:aws:iam:::oidc-provider/localhost:8080/auth/realms/quickstart"]},'
  - '"KeyId": "arn:aws:kms:us-west-2:111122223333:key/1234abcd-12ab-34cd-56ef-1234567890ab",'
  - '"aws-kms://arn:aws:kms:us-east-1:003084325827:key/84a66985-f968-4bac-82c2-365518adf157";'
  - return f"arn:aws:s3:::{bucket_name}"
  - return f"arn:aws:s3:::${bucket_name}"
- name: AWS AppSync API Key
  id: np.appsync.1
  pattern: '(?x)

    \b

    (da2-[a-z0-9]{26})

    \b

    '
  references:
  - https://docs.aws.amazon.com/appsync/latest/devguide/security-authz.html#api-key-authorization
  categories:
  - api
  - secret
  examples:
  - '  aws_appsync_apiKey: ''da2-nmaqhbb63zabjactesiydcfuvu'','
- name: AWS API Credentials
  id: np.aws.6
  pattern: '(?x)

    \b

